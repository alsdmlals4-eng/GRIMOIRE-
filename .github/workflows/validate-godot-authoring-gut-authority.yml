name: Validate Godot Authoring and GUT Authority Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-entry-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate tool authority adoption contract
        run: python -m unittest tests.test_godot_authoring_gut_authority_contract -v
      - name: Validate PR83 review-exception contract
        run: python -m unittest tests.test_pr83_review_exception_contract -v
      - name: Validate v4.3 binding and GUT adoption-spec contract
        run: python -m unittest tests.test_v4_3_contract_binding -v
      - name: Validate v4.4 project binding and cold-start authority
        run: python -m unittest tests.test_v4_4_contract_binding -v
      - name: Validate v4.4 unresolved-gate reconciliation
        run: python -m unittest tests.test_v4_4_formal_adoption_unresolved_reconciliation -v
      - name: Validate v4.4 post-merge canon synchronization
        run: python -m unittest tests.test_v4_4_post_merge_canon_sync -v
      - name: Validate live GitHub main readback semantics
        run: python -m unittest tests.test_v4_4_live_main_readback_semantics -v
      - name: Validate repo-wide GitHub Actions supply chain
        run: python -m unittest tests.test_v4_4_ci_supply_chain -v
      - name: Validate supply-chain canon reconciliation
        run: python -m unittest tests.test_v4_4_ci_supply_chain_canon_reconciliation -v
      - name: Validate HiGodot v3.1.2 historical vendor integrity
        run: python -m unittest tests.test_higodot_v3_1_2_vendor_integrity -v
      - name: Validate HiGodot v3.1.3 current tool-authority sync
        run: python -m unittest tests.test_higodot_v3_1_3_tool_authority_sync -v
      - name: Validate HiGodot v3.1.3 post-merge canon sync
        run: python -m unittest tests.test_higodot_v3_1_3_post_merge_canon_sync -v
      - name: Validate Hera v1.0.0 exact-pair contract
        run: python -m unittest tests.test_hera_v1_exact_pair_contract -v
      - name: Validate Hera live-canary canon reconciliation
        run: python -m unittest tests.test_hera_v1_pair_canon_reconciliation -v
