name: Apply Base v9.4.3 First Prompt Adapter Once

on:
  pull_request:
    paths:
      - "tools/apply_base_v943_first_prompt_adapter.py"
      - ".github/workflows/apply-base-v943-first-prompt-adapter.yml"

permissions:
  contents: write

jobs:
  patch-adapter:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python tools/apply_base_v943_first_prompt_adapter.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/generate_project_operating_views.py skills/PROJECT_BASE_ADAPTER.json skills/BASE_V9_ADAPTER.json skills/PROJECT_BASE_SKILL_ADAPTER.json skills/PROJECT_SKILL_SNAPSHOT.json
          git rm tools/apply_base_v943_first_prompt_adapter.py .github/workflows/apply-base-v943-first-prompt-adapter.yml
          git commit -m "chore: pin Base v9.4.3 first-prompt adapter"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
