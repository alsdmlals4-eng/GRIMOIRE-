name: Temporary Finalize Base v9.4.1

on:
  pull_request:
    paths:
      - ".github/workflows/temporary-finalize-base-v9-4-1.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/base-shared-external-ai-adapter-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Pin release, update generator and regenerate views
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = "3f2c4a624d302b704c1b5322eb5c9f34ad55abb9"
          evidence = "ff117d24d5bdb121314e109a6aa9b4f552e0fdc1"
          adapter_path = Path("skills/PROJECT_BASE_ADAPTER.json")
          adapter = json.loads(adapter_path.read_text(encoding="utf-8"))
          adapter["base_release"].update(version="9.4.1", release_commit=payload, release_evidence_commit=evidence)
          policy = adapter["base_v94_contract"]["external_ai_worktree"]
          policy.update(base_validator_adoption="ADOPTED_FROM_BASE_V9_4_1", base_validator_path="tools/check_external_ai_worktree_contract.py", base_release_lock="base-v9.4.1.lock.json", actual_external_ai_worktree_execution="NOT_RUN")
          adapter_path.write_text(json.dumps(adapter, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          generator = Path("tools/generate_project_operating_views.py")
          text = generator.read_text(encoding="utf-8")
          text = text.replace('"version": "9.4.0"', '"version": "9.4.1"').replace("a728712cb776ec98f4875914a580fcf7d0156593", payload).replace("ef1fba11167e4da0b298123b0c85ebd268191a42", evidence).replace('"release_line": "v9.4.0"', '"release_line": "v9.4.1"')
          generator.write_text(text, encoding="utf-8")

          for path in Path("tests").glob("test_base*.py"):
              text = path.read_text(encoding="utf-8")
              if "base_release" not in text and "BASE_RELEASE_COMMIT" not in text:
                  continue
              text = text.replace("a728712cb776ec98f4875914a580fcf7d0156593", payload).replace("ef1fba11167e4da0b298123b0c85ebd268191a42", evidence).replace('"9.4.0"', '"9.4.1"').replace("DEFER_UNTIL_NEXT_RELEASED_BASE_PIN", "ADOPTED_FROM_BASE_V9_4_1")
              if path.name == "test_base_shared_external_ai_adapter.py" and "base_validator_path" not in text:
                  anchor = 'self.assertEqual("ADOPTED_FROM_BASE_V9_4_1", policy["base_validator_adoption"])'
                  if anchor not in text:
                      anchor = 'self.assertEqual("ADOPTED_FROM_BASE_V9_4_1", override["base_validator_adoption"])'
                  text = text.replace(anchor, anchor + '\n        self.assertEqual("tools/check_external_ai_worktree_contract.py", policy.get("base_validator_path", override.get("base_validator_path") if "override" in locals() else None))\n        self.assertEqual("base-v9.4.1.lock.json", policy.get("base_release_lock", override.get("base_release_lock") if "override" in locals() else None))\n        self.assertEqual("NOT_RUN", policy.get("actual_external_ai_worktree_execution", override.get("actual_external_ai_worktree_execution") if "override" in locals() else None))')
              path.write_text(text, encoding="utf-8")
          PY
          python tools/generate_project_operating_views.py
          python tools/generate_project_operating_views.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills tools/generate_project_operating_views.py tests
          git commit -m "chore: finalize Base v9.4.1 project connection"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
