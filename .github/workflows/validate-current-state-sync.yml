name: Validate Task8 Legacy Save Preservation
on: [pull_request]

jobs:
  current-state-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: >-
          python -m unittest
          tests.test_task8_handoff_bcp_continuation
          tests.test_task8_remote_local_reverify
          tests.test_task8_local_recovery_probe_contract
          tests.test_task8_local_candidate_preservation_contract
          tests.test_task8_local_candidate_preservation_content_guard
          tests.test_task8_preservation_observed_reconciliation_prep
          -v
