name: Universal Loop visual SHADOW pilot

on:
  pull_request:
    paths:
      - "docs/operations/loop/**"
      - "tests/test_visual_platform_gate_sequencing.py"
      - ".github/workflows/validate-universal-loop-visual-pilot.yml"
  push:
    branches: [main]
    paths:
      - "docs/operations/loop/**"
      - "tests/test_visual_platform_gate_sequencing.py"
      - ".github/workflows/validate-universal-loop-visual-pilot.yml"

permissions:
  contents: read

jobs:
  visual-shadow:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate current project visual/platform contract
        run: python -m unittest tests.test_visual_platform_gate_sequencing -v
      - name: Check out pinned Base Universal Loop Kernel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: alsdmlals4-eng/Base
          ref: 8e7238a1bb9f49bd6e2403a2a6cb20d7aee863c7
          path: .base-loop
          persist-credentials: false
      - name: Install pinned Base contract dependencies
        run: python -m pip install --requirement .base-loop/.github/validation-requirements.txt
      - name: Run unmodified Base M2 to M3 visual SHADOW pipeline
        shell: pwsh
        run: |
          $request = Join-Path $env:RUNNER_TEMP 'loop-request.json'
          $result = Join-Path $env:RUNNER_TEMP 'loop-result.json'
          python .base-loop/tools/loop_capsule_to_shadow.py `
            docs/operations/loop/PROJECT_EXECUTION_CAPSULE.json `
            --run-id GR_VISUAL_SHADOW_001 `
            --observed-main-sha 6dc4c390d6516b95a70130e1f668b056a5a25b25 `
            --planning-drift NO_DRIFT `
            --visual-drift NO_DRIFT | Tee-Object -FilePath $request
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .base-loop/tools/loopctl.py shadow `
            $request `
            --project-root $env:GITHUB_WORKSPACE `
            --state-root (Join-Path $env:GITHUB_WORKSPACE '.loop-engineering') `
            --now 2026-08-14T00:00:00Z | Tee-Object -FilePath $result
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $payload = Get-Content -Raw $result | ConvertFrom-Json
          if ($payload.state -ne 'SHADOW_COMPLETE') { throw "unexpected state: $($payload.state)" }
          if ($payload.findings.Count -ne 0) { throw "unexpected findings" }
          if (-not $payload.semantic_input_digest) { throw "missing semantic digest" }
          if (-not $payload.receipt_digest) { throw "missing receipt digest" }
