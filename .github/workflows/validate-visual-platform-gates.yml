name: Validate visual and platform gates

on:
  pull_request:
    paths:
      - 'docs/superpowers/plans/2026-08-08-visual-platform-gate-sequencing.md'
      - 'docs/validation/WINDOWS_ANDROID_SHARED_CORE_STRUCTURAL.json'
      - 'START_HERE.md'
      - 'docs/ACTIVE_CONTEXT.md'
      - 'docs/DEVELOPMENT_GATES.md'
      - 'docs/planning/CURRENT_UNRESOLVED_GATES.md'
      - 'docs/planning/CURRENT_CONFIRMED_DECISIONS.md'
      - 'docs/planning/CANON_SYNC_STATE.json'
      - 'docs/planning/GRILL_ME_BATCH_MERGE_STATE.json'
      - 'tests/test_visual_platform_gate_sequencing.py'
      - '.github/workflows/validate-visual-platform-gates.yml'
      - 'project.godot'
      - 'src/core/**'
      - 'src/ui/mobile_safe_root.gd'
      - 'tests/integration/test_mobile_safe_root.gd'
  push:
    branches: [main]
    paths:
      - 'docs/validation/WINDOWS_ANDROID_SHARED_CORE_STRUCTURAL.json'
      - 'START_HERE.md'
      - 'docs/ACTIVE_CONTEXT.md'
      - 'docs/DEVELOPMENT_GATES.md'
      - 'docs/planning/CURRENT_UNRESOLVED_GATES.md'
      - 'docs/planning/CURRENT_CONFIRMED_DECISIONS.md'
      - 'docs/planning/CANON_SYNC_STATE.json'
      - 'docs/planning/GRILL_ME_BATCH_MERGE_STATE.json'
      - 'tests/test_visual_platform_gate_sequencing.py'
      - '.github/workflows/validate-visual-platform-gates.yml'
      - 'project.godot'
      - 'src/core/**'
      - 'src/ui/mobile_safe_root.gd'
      - 'tests/integration/test_mobile_safe_root.gd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-contract:
    name: shared-core-${{ matrix.os_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: windows
            runner: windows-2025
          - os_name: ubuntu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate gate sequencing and shared-core structure
        run: python -m unittest tests.test_visual_platform_gate_sequencing -v
      - name: Validate whitespace
        run: git diff --check
