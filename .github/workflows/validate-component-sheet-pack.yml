name: Validate Component Sheet Pack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run component sheet contract
        run: python -m unittest tests.test_component_sheet_pack_contract -v
      - name: Install verified Godot 4.7.1 engine
        run: |
          python tools/setup_godot_toolchain.py \
            --install-dir .tooling/godot \
            --json-report godot-component-sheet-toolchain-report.json
      - name: Import project vector assets
        run: |
          set -o pipefail
          timeout 60s .tooling/godot/4.7.1-stable/linux/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --import --path . | tee component-sheet-import.log
      - name: Run full Godot component regression
        run: |
          set -o pipefail
          timeout 45s .tooling/godot/4.7.1-stable/linux/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --script res://tests/test_runner.gd | tee component-sheet-headless.log
      - name: Capture eight component sheet evidence images
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          mkdir -p build/visual
          timeout 90s xvfb-run -a -s '-screen 0 1920x1080x24' \
            .tooling/godot/4.7.1-stable/linux/Godot_v4.7.1-stable_linux.x86_64 \
            --display-driver x11 --rendering-method gl_compatibility --path . \
            --script res://tools/capture_component_sheets.gd | tee component-sheet-capture.log
          test -s build/visual/component-sheet-a-1920x1080.png
          test -s build/visual/component-sheet-a-1280x720.png
          test -s build/visual/component-sheet-b-1920x1080.png
          test -s build/visual/component-sheet-b-1280x720.png
          test -s build/visual/component-sheet-c-1920x1080.png
          test -s build/visual/component-sheet-c-1280x720.png
          test -s build/visual/component-sheet-d-1920x1080.png
          test -s build/visual/component-sheet-d-1280x720.png
          test "$(find build/visual -maxdepth 1 -type f -name 'component-sheet-*.png' -size +10000c | wc -l)" -eq 8
      - name: Upload component sheet evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-sheet-pack-evidence
          path: |
            godot-component-sheet-toolchain-report.json
            component-sheet-import.log
            component-sheet-headless.log
            component-sheet-capture.log
            build/visual/component-sheet-*.png
          if-no-files-found: error
