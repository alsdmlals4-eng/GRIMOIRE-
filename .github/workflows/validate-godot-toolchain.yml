name: Validate Godot 4.7.1 toolchain

on:
  pull_request:
  workflow_dispatch:

jobs:
  godot-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Run toolchain contract tests
        run: python -m unittest tests.test_godot_toolchain_setup

      - name: Download and verify Godot and export templates
        run: |
          python tools/setup_godot_toolchain.py \
            --install-dir .tooling/godot \
            --with-templates \
            --json-report godot-toolchain-report.json

      - name: Upload toolchain report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godot-toolchain-report
          path: godot-toolchain-report.json
          if-no-files-found: error
