name: Validate Foundation POC

on:
  pull_request:
    paths:
      - 'project.godot'
      - 'src/**'
      - 'data/glyphs/**'
      - 'data/testing/**'
      - 'tests/**'
      - 'tools/check_glyph_resource_scope.py'
      - 'tools/check_glyph_vocabulary_scope.py'
      - 'tools/build_glyph_confusion_report.py'
      - 'tools/analyze_gr_test_032.py'
      - 'artifacts/foundation-poc/**'
      - 'artifacts/human-validation/**'
      - 'docs/validation/GLYPH_RESOURCE_POC_VALIDATION_REPORT.md'
      - 'docs/validation/GLYPH_RECOGNITION_POC_REPORT.md'
      - 'docs/validation/GLYPH_HUMAN_CIRCUIT_BRIDGE_PROTOCOL.md'
      - 'docs/validation/STAGE2_CIRCUIT_BRIDGE_HARNESS_REPORT.md'
      - 'docs/validation/GR_TEST_032_EXECUTION_RUNBOOK.md'
      - 'docs/validation/GR_TEST_032_MODERATOR_SCRIPT.md'
      - 'docs/validation/GR_TEST_032_DEVICE_PREFLIGHT.md'
      - 'docs/planning/GLYPH_RESOURCE_POC_STOP_GATE_01_2026-08-05.md'
      - 'docs/planning/GLYPH_RECOGNITION_POC_STOP_GATE_01_2026-08-05.md'
      - 'docs/planning/GLYPH_HUMAN_CIRCUIT_BRIDGE_01_APPROVAL_2026-08-05.md'
      - 'docs/planning/GLYPH_HUMAN_CIRCUIT_BRIDGE_01_ADVERSARIAL_REVIEW_2026-08-05.md'
      - 'docs/planning/STAGE2_CIRCUIT_BRIDGE_HARNESS_UX_HX_2026-08-05.md'
      - 'docs/planning/STAGE2_CIRCUIT_BRIDGE_HARNESS_STATE_MATRIX_2026-08-05.md'
      - 'docs/planning/STAGE2_CIRCUIT_BRIDGE_HARNESS_STOP_GATE_01_2026-08-05.md'
      - 'docs/superpowers/plans/2026-08-05-stage2-circuit-bridge-harness-implementation-plan.md'
      - 'docs/planning/sync/GR-SYNC-20260805-06-STAGE2-HARNESS-UX-HX.md'
      - 'docs/planning/sync/GR-SYNC-20260805-07-STAGE2-HARNESS-AUTOMATED.md'
      - 'docs/planning/CURRENT_RUNTIME_CHECKPOINT_2026-08-05.md'
      - 'docs/planning/CURRENT_CONFIRMED_DECISIONS.md'
      - 'docs/planning/CANON_STATUS_INDEX_2026-08-05.md'
      - 'docs/planning/CANON_SYNC_STATE.json'
      - 'docs/planning/GRILL_ME_BATCH_MERGE_STATE.json'
      - 'START_HERE.md'
      - 'docs/ACTIVE_CONTEXT.md'
      - 'docs/DEVELOPMENT_GATES.md'
      - 'docs/DOCUMENTATION_MAP.md'
      - 'docs/planning/README.md'
      - '.github/workflows/validate-foundation-poc.yml'
  workflow_dispatch:

jobs:
  foundation-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate glyph resource scope contract
        run: |
          python -m unittest tests.test_glyph_resource_scope -v
          python tools/check_glyph_resource_scope.py

      - name: Validate glyph vocabulary scope contract
        run: |
          python -m unittest tests.test_glyph_vocabulary_scope -v
          python tools/check_glyph_vocabulary_scope.py

      - name: Validate current checkpoint authority contract
        run: python -m unittest tests.test_current_checkpoint_authority -v

      - name: Validate staged human circuit bridge decision contract
        run: python -m unittest tests.test_human_circuit_bridge_decision -v

      - name: Validate Stage2 harness UX HX contract
        run: python -m unittest tests.test_stage2_harness_ux_hx_contract -v

      - name: Validate Stage2 harness implementation evidence
        run: python -m unittest tests.test_stage2_harness_implementation_contract -v

      - name: Validate GR-TEST-032 execution pack and analyzer
        run: |
          python -m unittest tests.test_gr_test_032_execution_pack -v
          python -m unittest tests.test_gr_test_032_analyzer -v

      - name: Validate glyph confusion report contract
        run: python -m unittest tests.test_glyph_confusion_report -v

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .tooling/godot
          key: godot-4.7.1-linux-x86_64

      - name: Install verified Godot
        run: |
          python tools/setup_godot_toolchain.py \
            --install-dir .tooling/godot \
            --json-report godot-foundation-toolchain-report.json

      - name: Run headless POC tests
        run: |
          set -o pipefail
          timeout 30s .tooling/godot/4.7.1-stable/linux/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --script res://tests/test_runner.gd | tee glyph-resource-headless.log

      - name: Build synthetic glyph confusion report
        run: |
          python tools/build_glyph_confusion_report.py \
            artifacts/foundation-poc/glyph-fixture-rows.json \
            --thresholds artifacts/foundation-poc/glyph-recognition-thresholds.json \
            > artifacts/foundation-poc/glyph-confusion-report.json
          python -m json.tool artifacts/foundation-poc/glyph-confusion-report.json > /dev/null

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-poc-evidence
          path: |
            godot-foundation-toolchain-report.json
            glyph-resource-headless.log
            artifacts/foundation-poc/glyph-recognition-thresholds.json
            artifacts/foundation-poc/glyph-fixture-rows.json
            artifacts/foundation-poc/glyph-confusion-report.json
            artifacts/foundation-poc/stage2-bridge-fixture-report.json
            artifacts/foundation-poc/stage2-bridge-event-schema.json
            artifacts/human-validation/gr-test-032-session-template.json
            artifacts/human-validation/gr-test-032-attempt-schema.json
            artifacts/human-validation/gr-test-032-result-template.json
          if-no-files-found: warn
