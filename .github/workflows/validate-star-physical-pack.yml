name: Validate Star Physical Validation Pack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  star-physical-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate GR-TEST-033 execution pack and analyzer
        run: python -m unittest tests.test_gr_test_033_star_physical_contract -v
