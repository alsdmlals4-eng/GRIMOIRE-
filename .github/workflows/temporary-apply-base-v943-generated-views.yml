name: Temporary Apply Base v9.4.3 Generated Views

on:
  pull_request:
    paths:
      - "tools/apply_base_v943_generated_views.py"
      - ".github/workflows/temporary-apply-base-v943-generated-views.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/apply_base_v943_generated_views.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/generate_project_operating_views.py skills/BASE_V9_ADAPTER.json skills/PROJECT_BASE_SKILL_ADAPTER.json skills/PROJECT_SKILL_SNAPSHOT.json
          git rm tools/apply_base_v943_generated_views.py .github/workflows/temporary-apply-base-v943-generated-views.yml
          git commit -m "chore: regenerate Base v9.4.3 operating views"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
