name: Validate Circle Clock Story Runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  circle-clock-story-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate current project authority
        run: python -m unittest tests.test_base_v9_adoption tests.test_current_authority_reality_contract -v
      - name: Install verified Godot 4.7.1 engine
        run: |
          python tools/setup_godot_toolchain.py \
            --install-dir .tooling/godot \
            --json-report godot-circle-clock-toolchain-report.json
      - name: Import current story runtime
        run: |
          set -o pipefail
          timeout 60s .tooling/godot/4.7.1-stable/linux/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --import | tee circle-clock-import.log
      - name: Run Circle / Clock story regression
        run: |
          set -o pipefail
          timeout 45s .tooling/godot/4.7.1-stable/linux/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --script res://tests/test_runner.gd | tee circle-clock-headless.log
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: circle-clock-story-runtime-evidence
          path: |
            godot-circle-clock-toolchain-report.json
            circle-clock-import.log
            circle-clock-headless.log
          if-no-files-found: warn
