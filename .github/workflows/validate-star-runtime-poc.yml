name: Validate Star Circuit Runtime POC

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  star-runtime-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate latest star-circuit canon
        run: python -m unittest tests.test_star_glyph_circuit_canon_contract -v
      - name: Validate runtime implementation and local runner contracts
        run: python -m unittest tests.test_star_runtime_implementation_contract -v
      - name: Validate reusable star UI kit contract
        run: python -m unittest tests.test_star_ui_kit_contract -v
      - name: Install verified Godot 4.7.1 engine
        run: |
          python tools/setup_godot_toolchain.py \
            --install-dir .tooling/godot \
            --json-report godot-star-runtime-toolchain-report.json
      - name: Run Godot headless runtime tests
        run: |
          set -o pipefail
          timeout 45s .tooling/godot/4.7.1-stable/linux/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path . --script res://tests/test_runner.gd | tee star-runtime-headless.log
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-runtime-poc-evidence
          path: |
            godot-star-runtime-toolchain-report.json
            star-runtime-headless.log
          if-no-files-found: warn
