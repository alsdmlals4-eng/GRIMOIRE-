name: Validate platform release and asset rights

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'assets/art/ui/common/**'
      - 'src/ui/theme/**'
      - 'src/ui/components/**'
      - 'docs/PLATFORM_RELEASE_AND_ASSET_RIGHTS_PROFILE.md'
      - 'docs/ASSET_RIGHTS_AND_PROVENANCE_RECORD.md'
      - 'docs/GAME_RELEASE_COMPLIANCE_EVIDENCE_PACK.md'
      - 'tests/test_platform_release_asset_rights_contract.py'
      - '.github/workflows/platform-release-asset-rights.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'assets/art/ui/common/**'
      - 'src/ui/theme/**'
      - 'src/ui/components/**'
      - 'docs/PLATFORM_RELEASE_AND_ASSET_RIGHTS_PROFILE.md'
      - 'docs/ASSET_RIGHTS_AND_PROVENANCE_RECORD.md'
      - 'docs/GAME_RELEASE_COMPLIANCE_EVIDENCE_PACK.md'
      - 'tests/test_platform_release_asset_rights_contract.py'
      - '.github/workflows/platform-release-asset-rights.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tests/test_platform_release_asset_rights_contract.py -v
      - run: git diff --check
